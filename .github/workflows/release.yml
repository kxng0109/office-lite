name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.4 (required for manual runs; a tag push uses the pushed tag)"
        required: false
        default: ""

permissions:
  contents: write

# No cancel-in-progress here: never cancel a publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Extract changelog section into release notes (validates tag matches package version)
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib

          tag = os.environ.get("TAG", "")
          if not tag.startswith("v"):
              raise SystemExit(
                  f"TAG must be a v-prefixed release tag, got {tag!r}; "
                  "set the 'tag' input for manual runs"
              )
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag[1:] != version:
              raise SystemExit(f"tag {tag!r} != pyproject {version!r}")

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          section, capture = [], False
          for line in text.splitlines():
              if line.startswith(heading):
                  capture = True
                  continue
              if capture and line.startswith("## "):
                  break
              if capture:
                  section.append(line)
          body = "\n".join(section).strip()
          if not body:
              raise SystemExit(f"no CHANGELOG section for [{version}]")

          def vkey(name):
              return tuple(int(part) for part in name[1:].split("."))

          cur = vkey(tag)
          tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).split()
          lower = [t for t in tags if vkey(t) < cur]
          parts = ["## What's changed", "", body]
          if lower:
              prev = max(lower, key=vkey)
              parts += [
                  "",
                  "## Full Changelog",
                  "",
                  f"https://github.com/{repo}/compare/{prev}...{tag}",
              ]
          pathlib.Path("release-notes.md").write_text("\n".join(parts) + "\n", encoding="utf-8")
          print(f"release-notes.md written for {tag}")
          PY
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Create or update release with changelog notes and dist assets
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "office-lite ${TAG#v}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "office-lite ${TAG#v}" --notes-file release-notes.md dist/*
          fi
          gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
