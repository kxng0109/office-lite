name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# No cancel-in-progress here: never cancel a publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5a4bd76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Check tag matches package version
        run: >
          python -c "import sys, tomllib;
          v = tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          tag = '${{ github.ref_name }}'.lstrip('v');
          sys.exit(f'tag {tag!r} != pyproject {v!r}') if tag != v else print(f'version ok: {v}')"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
