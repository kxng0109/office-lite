[project]
name = "office-lite"
version = "0.1.2"
description = "Lightweight local stdio MCP server for md/txt/docx/pptx/csv conversion"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  # Direct floors double as transitive pins: python-docx and python-pptx
  # allow older lxml and Pillow ranges with known CVEs, so these floors
  # force the secure versions verified in the audit. Ceilings guard the
  # next breaking major; bump deliberately with a fresh advisory check.
  "mcp>=2.3.0,<3",
  "lxml>=6.1.3,<7",
  "Pillow>=13.0.0,<14",
  "markdown-it-py>=4.2.0,<5",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "coverage>=7.16.2",
  "ruff>=0.17.1",
  "pip-audit>=2.10.1",
  "build>=1.6.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/office_lite --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/office_lite"]
branch = true

[tool.setuptools.packages.find]
where = ["src"]
